name: FLUXCUE Studio Pages Preview

on:
  push:
    branches: [main]

# No secrets, private repository references, remote host credentials or private actions.
permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Rzbck/FLUXCUE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact public source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version: '22'
      - name: Reject private information in tracked source
        run: node scripts/check-public-security.mjs --repo
      - name: Install deterministic dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit/security tests
        run: npm test
      - name: Build Pages preview only
        run: npm run build -- --mode pages
      - name: Scan preview and verify all page asset paths
        run: |
          set -euo pipefail
          node scripts/check-public-security.mjs --dist
          node scripts/check-pages-output.mjs
      - name: Upload static Pages preview (no deployment permission in this job)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.repository == 'Rzbck/FLUXCUE' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This job never checks out code, installs packages or executes project scripts.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check configured Pages destination
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6, node24
      - name: Deploy only the verified static artifact
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5, node24
