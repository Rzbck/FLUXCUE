name: FLUXCUE Studio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout (no saved credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Public repository security checks (before installing)
        run: node scripts/check-public-security.mjs --repo
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and static Studio build
        run: npm run build
      - name: Unit and security regression tests
        run: npm test
      - name: Reject unsafe static output
        run: node scripts/check-public-security.mjs --dist
