name: FLUXCUE Studio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout (no saved credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version: '22'
      - name: Public repository security checks (before installing)
        run: node scripts/check-public-security.mjs --repo
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and static Studio build
        run: npm run build
      - name: Unit and security regression tests
        run: npm test
      - name: Reject unsafe static output
        run: node scripts/check-public-security.mjs --dist
      - name: Build and verify GitHub Pages base path
        run: |
          set -euo pipefail
          npm run build -- --mode pages
          node scripts/check-public-security.mjs --dist
          node scripts/check-pages-output.mjs
      - name: Chromium browser smoke (real Ctrl+Z and Vue/Three gizmo lifecycle)
        run: |
          set -euo pipefail
          npm run build -- --mode smoke
          node scripts/browser-smoke.mjs
      - name: Preserve Chromium screenshot when browser test fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: fluxcue-browser-smoke
          path: ${{ runner.temp }}/fluxcue-browser-smoke.png
          if-no-files-found: ignore
